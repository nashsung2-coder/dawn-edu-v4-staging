<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<link rel="apple-touch-icon" href="favicon.svg">
<meta property="og:site_name" content="曙光教育">
<meta property="og:type" content="website">
<meta name="theme-color" content="#0a0e1f">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>曙光教育 v4 — 學習頁</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@700;900&family=Noto+Sans+TC:wght@400;500;700&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
:root {
  --ink-950: oklch(0.16 0.03 260);
  --ink-900: oklch(0.20 0.04 260);
  --paper-50: oklch(0.96 0.02 90);
  --paper-400: oklch(0.72 0.03 90);
  --brass-300: oklch(0.82 0.12 85);
  --brass-400: oklch(0.74 0.14 80);
  --brass-600: oklch(0.60 0.12 80);
  --teal-400: oklch(0.68 0.10 200);
  --signal-green: oklch(0.72 0.14 150);
  --signal-red: oklch(0.62 0.18 25);
}
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  background: var(--ink-950); color: var(--paper-50);
  font-family: "Noto Sans TC", sans-serif; font-size: 14px; line-height: 1.6;
}
body::before {
  content: ""; position: fixed; inset: 0; pointer-events: none; opacity: .035;
  background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='2'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
}
/* 頂欄 */
.topbar {
  display: flex; align-items: center; justify-content: space-between;
  padding: 12px 24px; border-bottom: 1px solid oklch(0.60 0.12 80 / 0.2);
  position: sticky; top: 0; background: oklch(0.16 0.03 260 / 0.95);
  backdrop-filter: blur(8px); z-index: 10;
}
.brand { font-family: "Noto Serif TC", serif; font-weight: 900; font-size: 17px; }
.brand span { color: var(--brass-400); }
.nav { display: flex; gap: 4px; }
.nav a {
  color: var(--paper-400); text-decoration: none; font-size: 13px;
  padding: 8px 14px; border-radius: 2px;
}
.nav a:hover { color: var(--paper-50); background: oklch(1 0 0 / 0.05); }
.nav a.active { color: var(--brass-300); background: oklch(0.74 0.14 80 / 0.1); }
.user-chip {
  display: flex; align-items: center; gap: 8px; font-size: 13px; color: var(--paper-400);
}
.user-chip .pts {
  font-family: "JetBrains Mono", monospace; color: var(--brass-300); font-weight: 700;
}
/* 主體 */
.main { max-width: 1080px; margin: 0 auto; padding: 24px; }
.page-head { margin-bottom: 20px; }
.page-head .en {
  font-family: "JetBrains Mono", monospace; font-size: 11px;
  letter-spacing: .2em; text-transform: uppercase; color: var(--brass-400);
}
.page-head h1 {
  font-family: "Noto Serif TC", serif; font-weight: 700;
  font-size: 24px; margin-top: 4px;
}
/* 卡片 */
.grid { display: grid; grid-template-columns: repeat(12, 1fr); gap: 12px; }
.card {
  background: var(--ink-900);
  border: 1px solid oklch(0.60 0.12 80 / 0.22);
  border-top: 2px solid var(--brass-400);
  border-radius: 3px; padding: 18px;
}
.card h2 {
  font-family: "Noto Serif TC", serif; font-size: 16px; font-weight: 700;
  margin-bottom: 12px;
}
.span4 { grid-column: span 4; } .span6 { grid-column: span 6; }
.span8 { grid-column: span 8; } .span12 { grid-column: span 12; }
.num {
  font-family: "JetBrains Mono", monospace; font-weight: 700;
  font-size: 28px; color: var(--brass-300);
}
.num-sm { font-family: "JetBrains Mono", monospace; font-size: 14px; color: var(--brass-300); }
.label { font-size: 12px; color: var(--paper-400); }
.bar { height: 5px; background: oklch(1 0 0 / 0.08); border-radius: 2px; overflow: hidden; margin: 8px 0; }
.bar > div { height: 100%; background: var(--brass-400); }
.btn {
  display: inline-block; padding: 9px 20px; font-size: 14px; font-weight: 700;
  border-radius: 2px; border: 1px solid transparent; cursor: pointer;
  font-family: "Noto Sans TC", sans-serif;
}
.btn-primary { background: var(--brass-400); color: var(--ink-950); }
.btn-primary:hover { background: var(--brass-300); }
.btn-ghost { background: transparent; color: var(--paper-400); border-color: oklch(0.60 0.12 80 / 0.35); }
.btn-ghost:hover { color: var(--brass-300); border-color: var(--brass-400); }
/* 表格 */
table { width: 100%; border-collapse: collapse; font-size: 13px; }
th {
  font-family: "JetBrains Mono", monospace; font-size: 10px; letter-spacing: .15em;
  text-transform: uppercase; color: var(--brass-400); text-align: left;
  padding: 10px 12px; border-bottom: 1px solid oklch(0.60 0.12 80 / 0.3);
}
td { padding: 10px 12px; border-bottom: 1px solid oklch(1 0 0 / 0.05); }
td.n { font-family: "JetBrains Mono", monospace; text-align: right; color: var(--brass-300); }
/* 印章 */
.seal {
  width: 56px; height: 56px; border-radius: 50%;
  border: 2px solid var(--brass-400);
  display: inline-flex; align-items: center; justify-content: center;
  font-family: "Noto Serif TC", serif; font-weight: 900; font-size: 18px;
  color: var(--brass-300); background: oklch(0.74 0.14 80 / 0.07);
  margin-right: 8px;
}
/* 首次引導（只顯示一次） */
.onboarding {
  position: fixed; inset: 0; background: oklch(0 0 0 / 0.7);
  display: flex; align-items: center; justify-content: center; z-index: 50;
}
.onboarding .box {
  background: var(--ink-900); border: 1px solid var(--brass-600);
  border-top: 2px solid var(--brass-400); border-radius: 4px;
  padding: 32px; max-width: 440px; margin: 24px;
}
.onboarding h2 { font-family: "Noto Serif TC", serif; font-size: 20px; margin-bottom: 12px; }
.onboarding ol { margin: 0 0 20px 20px; color: var(--paper-400); font-size: 14px; }
.onboarding ol li { margin-bottom: 8px; }
@media (max-width: 768px) {
  .span4, .span6, .span8 { grid-column: span 12; }
  .nav { display: none; }
  .page-head h1 { font-size: 20px; }
}
</style>
</head>
<body>

<div class="topbar">
  <div class="brand">曙光<span>教育</span></div>
  <nav class="nav">
    <a href="#" class="active">學習</a>
    <a href="#">費曼</a>
    <a href="#">對戰</a>
    <a href="#">複習</a>
    <a href="#">知識庫</a>
    <a href="#">島嶼</a>
  </nav>
  <div class="user-chip"><span class="pts">1,240</span> 星砂</div>
</div>

<div class="main">
  <div class="page-head">
    <div class="en">Dashboard</div>
    <h1>學習總覽</h1>
  </div>

  <div class="grid">
    <div class="card span4">
      <h2>今日複習</h2>
      <div class="num">3<span style="font-size:16px;color:var(--paper-400)">/5</span></div>
      <div class="bar"><div style="width:60%"></div></div>
      <div style="margin-top:12px;"><button class="btn btn-primary">繼續</button></div>
    </div>
    <div class="card span4">
      <h2>費曼說服</h2>
      <div class="num">87.5<span style="font-size:16px;color:var(--paper-400)">%</span></div>
      <div class="label">平均完整度 · 本週 4 次</div>
      <div style="margin-top:12px;"><button class="btn btn-ghost">開始</button></div>
    </div>
    <div class="card span4">
      <h2>對戰</h2>
      <div class="num">12<span style="font-size:16px;color:var(--paper-400)">勝</span></div>
      <div class="label">勝率 75% · 最高連勝 5</div>
      <div style="margin-top:12px;"><button class="btn btn-ghost">開戰</button></div>
    </div>

    <div class="card span8">
      <h2>主題掌握度</h2>
      <table>
        <tr><th>主題</th><th style="width:40%">掌握度</th><th style="text-align:right;">對戰</th></tr>
        <tr><td>牛頓第二運動定律</td><td><div class="bar"><div style="width:87%"></div></div></td><td class="n">12</td></tr>
        <tr><td>光合作用</td><td><div class="bar"><div style="width:64%"></div></div></td><td class="n">8</td></tr>
        <tr><td>二次函數</td><td><div class="bar"><div style="width:43%"></div></div></td><td class="n">5</td></tr>
      </table>
    </div>
    <div class="card span4">
      <h2>徽章</h2>
      <div><span class="seal">辯</span><span class="seal">學</span><span class="seal">思</span></div>
      <div class="label" style="margin-top:12px;">3 枚 · 稀有 1</div>
    </div>
  </div>
</div>

<!-- 首次引導：localStorage 沒標記才顯示 -->
<div class="onboarding" id="ob" style="display:none;">
  <div class="box">
    <div class="en" style="font-family:'JetBrains Mono',monospace;font-size:11px;letter-spacing:.2em;color:var(--brass-400);margin-bottom:8px;">WELCOME</div>
    <h2>第一次來？</h2>
    <ol>
      <li>去「費曼」用自己的話講概念</li>
      <li>去「對戰」找人 PK 賺徽章</li>
      <li>每天回來「複習」到期卡片</li>
    </ol>
    <button class="btn btn-primary" onclick="localStorage.setItem('dawn:v4:seen','1');document.getElementById('ob').style.display='none'">知道了</button>
  </div>
</div>
<script>
if (!localStorage.getItem('dawn:v4:seen')) document.getElementById('ob').style.display = 'flex';
</script>

</body>
</html>
