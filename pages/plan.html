<style>
.plan-event { display:flex; gap:10px; align-items:baseline; padding:8px 0; border-bottom:1px dashed var(--wash-08); font-size:14px; }
.plan-event:last-child { border-bottom:none; }
.plan-event .t { color:var(--brass-300); font-family:var(--font-mono); font-size:12px; white-space:nowrap; }
.plan-slot { display:flex; gap:10px; align-items:center; padding:10px 12px; border:1px solid var(--wash-08); border-radius:12px; margin-bottom:8px; font-size:14px; }
.plan-slot input { width:18px; height:18px; accent-color:var(--brass-400); flex:none; }
.plan-slot .when { color:var(--brass-300); font-family:var(--font-mono); font-size:12px; white-space:nowrap; }
.plan-day { font-size:13px; color:var(--paper-400); margin:18px 0 8px; }
</style>
</head>

<main class="main">
  <div class="page-head">
    <div class="en">Study Planner</div>
    <h1>學習排程</h1>
    <p style="color:var(--paper-400);font-size:14px;">接上你的 Google 日曆，把複習塞進零碎時間</p>
  </div>
  <div id="plan-view"></div>
</main>
