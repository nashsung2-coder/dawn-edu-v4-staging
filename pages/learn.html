<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>曙光教育 — 學習總覽</title>
<link rel="manifest" href="../manifest.json">
<link rel="stylesheet" href="../css/tokens.css">
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@700;900&family=Noto+Sans+TC:wght@400;500;700&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
</head>
<body>
<div class="main">
  <div class="page-head">
    <div class="en">Dashboard</div>
    <h1>學習總覽</h1>
  </div>
  <div id="learn-view">
    <div class="grid">
      <div class="card span4"><div class="skeleton" style="height:120px"></div></div>
      <div class="card span4"><div class="skeleton" style="height:120px"></div></div>
      <div class="card span4"><div class="skeleton" style="height:120px"></div></div>
      <div class="card span8"><div class="skeleton" style="height:200px"></div></div>
      <div class="card span4"><div class="skeleton" style="height:200px"></div></div>
    </div>
  </div>
</div>
<script src="../js/vendor/supabase.min.js"></script>
<script>
/* 全域錯誤顯示：任何 JS 錯誤直接顯示在頁面上 */
window.addEventListener("error", function(e) {
  var view = document.getElementById("learn-view");
  if (view && !view.dataset.errShown) {
    view.dataset.errShown = "1";
    view.innerHTML = '<div class="state-empty"><p>錯誤：' + (e.message || "未知") + '</p><p style="font-size:12px;opacity:.7">' + (e.filename || "") + '</p><button class="btn btn-primary" onclick="location.reload()">重試</button></div>';
  }
}, true);
/* OAuth callback 兜底 */
(function() {
  try {
    if (window.location.hash && window.location.hash.indexOf("access_token=") !== -1) {
      var params = new URLSearchParams(window.location.hash.substring(1));
      var at = params.get("access_token"), rt = params.get("refresh_token");
      if (at && rt && window.supabase) {
        var client = window.supabase.createClient(
          "https://bcdanvmuffxgtezopyib.supabase.co",
          "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImJjZGFudm11ZmZ4Z3Rlem9weWliIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTE3OTEzNTMsImV4cCI6MjEwNzM2NzM1M30.EZtkULSRB_qwVyDl86MOhGf_ihKAAMy7q3fwuKYX0JI"
        );
        client.auth.setSession({ access_token: at, refresh_token: rt }).then(function() {
          window.history.replaceState(null, "", window.location.pathname);
          window.location.reload();
        });
      }
    }
  } catch (e) {}
})();
</script>
<script type="module" src="../js/pages/learn.js?v=20261015"></script>
</body>
</html>
