<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<link rel="icon" type="image/svg+xml" href="../favicon.svg">
<link rel="apple-touch-icon" href="../favicon.svg">
<meta property="og:site_name" content="曙光教育">
<meta property="og:type" content="website">
<meta name="theme-color" content="#0a0e1f">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>曙光教育 — 登入</title>
<link rel="manifest" href="../manifest.json">
<link rel="stylesheet" href="../css/tokens.css">
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@700;900&family=Noto+Sans+TC:wght@400;500;700&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
<script src="../js/vendor/supabase.min.js"></script>
<script>
/* 清除舊版 v3 留下的 Service Worker */
if ("serviceWorker" in navigator) {
  navigator.serviceWorker.getRegistrations().then(function(rs) {
    rs.forEach(function(r) { r.unregister(); });
  }).catch(function(){});
}
</script>
<style>
.login-wrap {
  min-height: 100vh; display: flex; align-items: center; justify-content: center;
  padding: 24px; position: relative; z-index: 1;
}
.login-box {
  width: 100%; max-width: 400px;
  background: var(--ink-900);
  border: 1px solid oklch(0.60 0.12 80 / 0.22);
  border-top: 2px solid var(--brass-400);
  border-radius: 3px; padding: 36px 32px;
}
.login-box .en {
  font-family: var(--font-mono); font-size: 11px;
  letter-spacing: .2em; text-transform: uppercase; color: var(--brass-400);
  margin-bottom: 8px;
}
.login-box h1 {
  font-family: var(--font-display); font-weight: 900;
  font-size: 28px; margin-bottom: 4px;
}
.login-box h1 span { color: var(--brass-400); }
.login-box .sub { color: var(--paper-400); font-size: 13px; margin-bottom: 28px; }
.divider {
  display: flex; align-items: center; gap: 12px;
  margin: 20px 0; color: var(--paper-400); font-size: 12px;
}
.divider::before, .divider::after {
  content: ""; flex: 1; height: 1px; background: oklch(1 0 0 / 0.1);
}
.btn-google {
  width: 100%; display: flex; align-items: center; justify-content: center; gap: 10px;
  background: var(--paper-50); color: #1a1a1a;
  padding: 11px; font-size: 14px; font-weight: 700;
  border-radius: 2px; border: none; cursor: pointer;
  font-family: var(--font-body);
}
.btn-google:hover { background: #fff; }
.btn-google svg { width: 18px; height: 18px; }
.btn-block { width: 100%; }
.fb { font-size: 13px; min-height: 20px; margin-top: 12px; text-align: center; }
.fb.err { color: var(--signal-red); }
.time-bg {
  position: fixed; inset: 0; z-index: -1;
  background-size: cover; background-position: center;
  opacity: 0.15;
}
</style>
</head>
<body>
<div class="login-wrap">
  <div class="login-box">
    <div class="en">Dawn Education</div>
    <h1>曙光<span>教育</span></h1>
    <p class="sub">深夜圖書館開館中</p>

    <button class="btn-google" id="btn-google" type="button">
      <svg viewBox="0 0 24 24"><path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/><path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/><path fill="#FBBC05" d="M5.84 14.1c-.22-.66-.35-1.36-.35-2.1s.13-1.44.35-2.1V7.06H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.94l3.66-2.84z"/><path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.06l3.66 2.84c.87-2.6 3.3-4.52 6.16-4.52z"/></svg>
      使用 Google 帳號登入
    </button>

    <div class="divider">或</div>

    <form id="form-login">
      <div class="field">
        <label for="f-email">電子郵件</label>
        <input class="input" id="f-email" type="email" autocomplete="email" required>
      </div>
      <div class="field">
        <label for="f-password">密碼</label>
        <input class="input" id="f-password" type="password" autocomplete="current-password" required>
      </div>
      <button class="btn btn-primary btn-block" type="submit" id="btn-login">登入</button>
      <div class="fb" id="login-fb"></div>
      <p style="text-align:center;margin-top:16px;font-size:13px;color:var(--paper-400);">
        <span id="auth-switch-text">還沒有帳號？</span>
        <a href="#" id="auth-switch" style="color:var(--brass-400);">註冊</a>
      </p>
    </form>
  </div>
</div>
<script>
/* v4 登入頁：零依賴版（不用 ES module，直接 REST API） */
(function() {
  "use strict";
  var SUPABASE_URL = "https://bcdanvmuffxgtezopyib.supabase.co";
  var ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImJjZGFudm11ZmZ4Z3Rlem9weWliIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTE3OTEzNTMsImV4cCI6MjEwNzM2NzM1M30.EZtkULSRB_qwVyDl86MOhGf_ihKAAMy7q3fwuKYX0JI";

  /* 時段背景 */
  function timeSlot() {
    var h = new Date().getHours();
    if (h >= 5 && h < 9) return "dawn";
    if (h >= 9 && h < 17) return "day";
    if (h >= 17 && h < 20) return "dusk";
    return "night";
  }
  var BG_MAP = {
    dawn: "../assets/bg-dawn.webp",
    day: "../assets/bg-day.webp",
    dusk: "../assets/bg-dusk.webp",
    night: "../assets/bg-night.webp"
  };
  var bgEl = document.createElement("div");
  bgEl.className = "time-bg";
  bgEl.style.backgroundImage = 'url("' + BG_MAP[timeSlot()] + '")';
  document.body.insertBefore(bgEl, document.body.firstChild);

  var fb = document.getElementById("login-fb");
  var btnLogin = document.getElementById("btn-login");
  var formLogin = document.getElementById("form-login");
  var authSwitch = document.getElementById("auth-switch");
  var authSwitchText = document.getElementById("auth-switch-text");
  var mode = "login";

  function setFb(msg, isErr) {
    fb.textContent = msg;
    fb.className = "fb" + (isErr ? " err" : "");
  }

  /* 檢查是否已登入 */
  function getSession() {
    try {
      var key = "sb-bcdanvmuffxgtezopyib-auth-token";
      var raw = localStorage.getItem(key);
      if (!raw) return null;
      var data = JSON.parse(raw);
      return data && data.access_token ? data : null;
    } catch (e) { return null; }
  }
  if (getSession()) {
    window.location.href = "learn.html";
    return;
  }

  /* 切換登入/註冊 */
  authSwitch.onclick = function(e) {
    e.preventDefault();
    if (mode === "login") {
      mode = "signup";
      btnLogin.textContent = "註冊";
      authSwitchText.textContent = "已有帳號？";
      authSwitch.textContent = "登入";
    } else {
      mode = "login";
      btnLogin.textContent = "登入";
      authSwitchText.textContent = "還沒有帳號？";
      authSwitch.textContent = "註冊";
    }
    setFb("", false);
  };

  /* Google 登入：直接導向 OAuth */
  document.getElementById("btn-google").onclick = function() {
    var redirectTo = window.location.origin + "/pages/learn.html";
    var url = SUPABASE_URL + "/auth/v1/authorize?provider=google&redirect_to=" + encodeURIComponent(redirectTo);
    window.location.href = url;
  };

  /* 帳密登入/註冊：直接打 REST API */
  formLogin.onsubmit = function(e) {
    e.preventDefault();
    var email = document.getElementById("f-email").value.trim();
    var password = document.getElementById("f-password").value;
    if (!email || !password) { setFb("請輸入電子郵件和密碼", true); return; }
    if (mode === "signup" && password.length < 6) { setFb("密碼至少 6 個字元", true); return; }
    btnLogin.disabled = true;
    setFb("", false);

    var endpoint, body;
    if (mode === "signup") {
      endpoint = SUPABASE_URL + "/auth/v1/signup";
      body = JSON.stringify({ email: email, password: password });
    } else {
      endpoint = SUPABASE_URL + "/auth/v1/token?grant_type=password";
      body = JSON.stringify({ email: email, password: password });
    }

    fetch(endpoint, {
      method: "POST",
      headers: {
        "apikey": ANON_KEY,
        "Content-Type": "application/json"
      },
      body: body
    }).then(function(res) {
      return res.json().then(function(data) {
        if (!res.ok) throw new Error(data.msg || data.error || "登入失敗");
        return data;
      });
    }).then(function(data) {
      if (data.user) {
        /* 用 Supabase client 的 setSession 存 session（格式相容） */
        try {
          var client = window.supabase.createClient(SUPABASE_URL, ANON_KEY);
          client.auth.setSession({
            access_token: data.access_token,
            refresh_token: data.refresh_token
          }).then(function() {
            window.location.href = "learn.html";
          }).catch(function() {
            /* setSession 失敗時 fallback 手動存 */
            try {
              localStorage.setItem("sb-bcdanvmuffxgtezopyib-auth-token", JSON.stringify({
                access_token: data.access_token,
                refresh_token: data.refresh_token,
                user: data.user
              }));
            } catch (e) {}
            window.location.href = "learn.html";
          });
        } catch (e) {
          window.location.href = "learn.html";
        }
      } else if (mode === "signup") {
        setFb("註冊成功！請檢查信箱驗證後再登入", false);
        btnLogin.disabled = false;
      }
    }).catch(function(err) {
      var msg = "登入失敗，請稍後再試";
      if (/Invalid login credentials/i.test(err.message)) msg = "帳號或密碼錯誤";
      else if (/User already registered/i.test(err.message)) msg = "此信箱已註冊，請直接登入";
      else if (/Email not confirmed/i.test(err.message)) msg = "信箱尚未驗證，請檢查驗證信";
      setFb(msg === "登入失敗，請稍後再試" ? "失敗：" + err.message : msg, true);
      btnLogin.disabled = false;
    });
  };
})();
</script>
</body>
</html>
