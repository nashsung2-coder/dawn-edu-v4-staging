<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>曙光學習 — 蘇格拉底對話</title>
<link rel="stylesheet" href="../css/tokens.css">
<style>
.soc-layout { display: flex; max-width: 1280px; margin: 0 auto; min-height: calc(100vh - 60px); }
/* 左：對話區 */
.soc-chat { flex: 1; display: flex; flex-direction: column; padding: 20px; min-width: 0; }
.soc-msgs { flex: 1; overflow-y: auto; display: flex; flex-direction: column; gap: 14px; padding: 10px 4px; max-height: calc(100vh - 260px); }
.soc-msg { padding: 12px 16px; border-radius: 14px; font-size: 14px; line-height: 1.75; max-width: 88%; }
.soc-msg.ai { background: oklch(0.74 0.14 80 / 0.07); border: 1px solid oklch(0.74 0.14 80 / 0.22); align-self: flex-start; border-bottom-left-radius: 4px; }
.soc-msg.user { background: oklch(0.6 0.2 250 / 0.14); border: 1px solid oklch(0.6 0.2 250 / 0.28); align-self: flex-end; border-bottom-right-radius: 4px; }
.soc-msg .role { font-size: 11px; color: var(--paper-400); margin-bottom: 4px; }
.soc-input-bar { display: flex; gap: 8px; margin-top: 12px; position: sticky; bottom: 0; background: var(--ink-900); padding: 12px 0; }
.soc-input-bar .input { flex: 1; border-radius: 20px; padding: 12px 18px; }
/* 右：整理區 */
.soc-side { width: 320px; flex-shrink: 0; border-left: 1px solid oklch(1 0 0 / 0.08); padding: 20px 16px; overflow-y: auto; max-height: calc(100vh - 60px); }
.soc-side h3 { font-size: 13px; color: var(--brass-300); margin: 0 0 10px; }
.soc-side .sec { margin-bottom: 20px; }
.soc-thread { font-size: 13px; line-height: 1.7; }
.soc-thread .t-item { padding: 8px 10px; border-left: 2px solid oklch(0.74 0.14 80 / 0.4); margin-bottom: 8px; background: oklch(1 0 0 / 0.02); border-radius: 0 8px 8px 0; }
.soc-kcard { background: oklch(0.74 0.14 80 / 0.06); border: 1px solid oklch(0.74 0.14 80 / 0.2); border-radius: 10px; padding: 10px 12px; margin-bottom: 8px; font-size: 13px; }
.soc-kcard .k-term { font-weight: 700; color: var(--brass-300); margin-bottom: 4px; }
.soc-tool { display: block; width: 100%; text-align: left; margin-bottom: 8px; }
.soc-empty { font-size: 12px; color: var(--paper-400); }
/* 初始設定卡 */
.soc-setup { max-width: 640px; margin: 40px auto; padding: 0 16px; }
.typing span { animation: blink 1s infinite; }
.typing span:nth-child(2) { animation-delay: .2s; }
.typing span:nth-child(3) { animation-delay: .4s; }
@keyframes blink { 0%,100% { opacity: .2; } 50% { opacity: 1; } }
@media (max-width: 900px) {
  .soc-layout { flex-direction: column; }
  .soc-side { width: auto; border-left: none; border-top: 1px solid oklch(1 0 0 / 0.08); max-height: none; }
  .soc-msgs { max-height: 50vh; }
}
</style>
</head>
<body>
<div id="topbar"></div>

<!-- 初始設定 -->
<div class="soc-setup" id="soc-setup">
  <div class="en" style="font-family:var(--font-mono);font-size:11px;letter-spacing:.2em;color:var(--brass-400);margin-bottom:8px;">SOCRATIC DIALOGUE</div>
  <h1 style="margin-bottom:8px;">蘇格拉底對話</h1>
  <p style="font-size:13px;color:var(--paper-400);margin-bottom:20px;">AI 不會直接給你答案，而是用問題引導你自己想通，並找出你思考中的漏洞。</p>
  <div class="card">
    <label style="font-size:13px;display:block;margin-bottom:6px;">主題標題</label>
    <input class="input" id="soc-title" placeholder="例如：宋朝賦稅制度" style="width:100%;margin-bottom:12px;">
    <label style="font-size:13px;display:block;margin-bottom:6px;">這個主題涵蓋哪些內容？（簡單敘述）</label>
    <textarea class="input" id="soc-scope" rows="3" placeholder="例如：宋朝如何收稅、錢都花去哪、為什麼這樣設計…" style="width:100%;"></textarea>
    <p style="font-size:12px;color:var(--paper-400);margin:8px 0 16px;">描述得越清楚，AI 的提問就越精準。不用很正式，像跟朋友解釋一樣就行。</p>
    <button class="btn btn-primary" id="soc-start">開始對話</button>
    <div id="soc-err" style="color:var(--signal-red);font-size:13px;margin-top:10px;display:none;"></div>
  </div>
</div>

<!-- 對話主畫面 -->
<div class="soc-layout" id="soc-main" style="display:none;">
  <div class="soc-chat">
    <div style="margin-bottom:8px;">
      <span style="font-size:15px;font-weight:700;" id="soc-topic-display"></span>
      <span style="font-size:12px;color:var(--paper-400);margin-left:8px;" id="soc-round-display"></span>
    </div>
    <div class="soc-msgs" id="soc-msgs"></div>
    <div class="soc-input-bar">
      <input class="input" id="soc-input" placeholder="回答 AI 的問題，或提出你的疑問…">
      <button class="btn btn-primary" id="soc-send" style="border-radius:20px;">送出</button>
    </div>
    <div style="display:flex;gap:8px;margin-top:8px;">
      <button class="btn btn-ghost btn-sm" id="soc-finish">我懂了，結束</button>
      <button class="btn btn-ghost btn-sm" id="soc-save">存為知識節點</button>
    </div>
  </div>
  <div class="soc-side">
    <div class="sec">
      <h3>🧰 整理工具</h3>
      <button class="btn btn-ghost btn-sm soc-tool" id="tool-thread">📝 整理思考脈絡</button>
      <button class="btn btn-ghost btn-sm soc-tool" id="tool-cards">🗂️ 生成知識卡片</button>
      <button class="btn btn-ghost btn-sm soc-tool" id="tool-summary">✨ 對話總結</button>
    </div>
    <div class="sec">
      <h3>🧭 思考脈絡</h3>
      <div class="soc-thread" id="soc-thread"><div class="soc-empty">對話開始後，AI 會在這裡整理你的思考路徑。</div></div>
    </div>
    <div class="sec">
      <h3>💡 知識卡片</h3>
      <div id="soc-cards"><div class="soc-empty">關鍵概念會自動整理成卡片。</div></div>
    </div>
  </div>
</div>

<script type="module" src="../js/pages/socratic.js?v=fixed002"></script>
</body>
</html>
