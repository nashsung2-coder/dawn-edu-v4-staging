<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>曙光教育 — 蘇格拉底對話</title>
<link rel="stylesheet" href="../css/tokens.css">
<style>
.soc-wrap { max-width: 720px; margin: 0 auto; padding: 20px 16px 100px; }
.soc-step { display: none; }
.soc-step.on { display: block; }
.soc-msgs { display: flex; flex-direction: column; gap: 12px; margin: 16px 0; }
.soc-msg { padding: 12px 16px; border-radius: 12px; font-size: 14px; line-height: 1.7; max-width: 90%; }
.soc-msg.ai { background: oklch(0.74 0.14 80 / 0.08); border: 1px solid oklch(0.74 0.14 80 / 0.25); align-self: flex-start; }
.soc-msg.user { background: oklch(0.6 0.2 250 / 0.12); border: 1px solid oklch(0.6 0.2 250 / 0.3); align-self: flex-end; }
.soc-msg .role { font-size: 11px; color: var(--paper-400); margin-bottom: 4px; }
.soc-input-row { display: flex; gap: 8px; margin-top: 12px; }
.soc-input-row .input { flex: 1; }
.soc-hint { font-size: 12px; color: var(--paper-400); margin-top: 8px; line-height: 1.6; }
.soc-actions { display: flex; gap: 8px; margin-top: 16px; flex-wrap: wrap; }
.typing { display: inline-block; }
.typing span { animation: blink 1s infinite; }
.typing span:nth-child(2) { animation-delay: 0.2s; }
.typing span:nth-child(3) { animation-delay: 0.4s; }
@keyframes blink { 0%, 100% { opacity: 0.2; } 50% { opacity: 1; } }
</style>
</head>
<body>
<div id="topbar"></div>
<div class="soc-wrap">
  <div class="en" style="font-family:var(--font-mono);font-size:11px;letter-spacing:.2em;color:var(--brass-400);margin-bottom:8px;">SOCRATIC DIALOGUE</div>
  <h1 style="margin-bottom:8px;">蘇格拉底對話</h1>
  <p style="font-size:13px;color:var(--paper-400);margin-bottom:20px;">AI 不會直接給你答案，而是用問題引導你自己想通，並找出你思考中的漏洞。</p>

  <!-- Step 1: 主題設定 -->
  <div class="soc-step on" id="step1">
    <div class="card">
      <h2 style="margin-bottom:12px;">先告訴我你要學什麼</h2>
      <label style="font-size:13px;display:block;margin-bottom:6px;">主題標題</label>
      <input class="input" id="soc-title" placeholder="例如：光合作用" style="width:100%;margin-bottom:12px;">
      <label style="font-size:13px;display:block;margin-bottom:6px;">這個主題涵蓋哪些內容？（簡單敘述）</label>
      <textarea class="input" id="soc-scope" rows="4" placeholder="例如：植物如何利用陽光、水和二氧化碳製造養分，包括光反應和暗反應的過程…" style="width:100%;"></textarea>
      <div class="soc-hint">描述得越清楚，AI 的提問就越精準。不用很正式，像跟朋友解釋一樣就行。</div>
      <div class="soc-actions">
        <button class="btn btn-primary" id="soc-start">開始對話</button>
      </div>
    </div>
  </div>

  <!-- Step 2: 對話 -->
  <div class="soc-step" id="step2">
    <div class="card" style="margin-bottom:12px;">
      <div style="font-size:14px;font-weight:700;" id="soc-topic-display"></div>
      <div style="font-size:12px;color:var(--paper-400);margin-top:4px;" id="soc-scope-display"></div>
    </div>
    <div class="soc-msgs" id="soc-msgs"></div>
    <div class="soc-input-row">
      <input class="input" id="soc-input" placeholder="提出你的問題，或回答 AI 的提問…">
      <button class="btn btn-primary" id="soc-send">送出</button>
    </div>
    <div class="soc-actions">
      <button class="btn btn-ghost btn-sm" id="soc-finish">我懂了，結束對話</button>
      <button class="btn btn-ghost btn-sm" id="soc-restart">重新開始</button>
    </div>
  </div>

  <!-- Step 3: 總結 -->
  <div class="soc-step" id="step3">
    <div class="card">
      <h2 style="margin-bottom:12px;">對話總結</h2>
      <div id="soc-summary" style="font-size:14px;line-height:1.8;"></div>
      <div class="soc-actions">
        <button class="btn btn-primary" id="soc-save">存為知識節點</button>
        <button class="btn btn-ghost" id="soc-back-learn">回學習總覽</button>
      </div>
    </div>
  </div>
</div>
<script type="module" src="../js/pages/socratic.js?v=fixed002"></script>
</body>
</html>
