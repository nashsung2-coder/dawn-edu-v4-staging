<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<link rel="icon" type="image/svg+xml" href="../favicon.svg">
<link rel="apple-touch-icon" href="../favicon.svg">
<meta property="og:site_name" content="曙光學習">
<meta property="og:type" content="website">
<meta name="theme-color" content="#0a0e1f">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>情境式學習 — 曙光學習</title>
<link rel="manifest" href="../manifest.json">
<link rel="stylesheet" href="../css/tokens.css">
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@700;900&family=Noto+Sans+TC:wght@400;500;700&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
.sc-setup { max-width: 560px; }
.sc-field { margin-bottom: 16px; }
.sc-field label { display: block; font-size: 13px; color: var(--paper-400); margin-bottom: 6px; }
.sc-field select, .sc-field input[type=text] {
  width: 100%; padding: 12px 14px; border-radius: 8px;
  background: var(--ink-800); color: var(--paper-50);
  border: 1px solid oklch(1 0 0 / 0.1); font-size: 14px; font-family: var(--font-body);
}
.sc-story {
  background: var(--ink-800); border: 1px solid oklch(1 0 0 / 0.08);
  border-radius: 12px; padding: 24px; margin-bottom: 16px;
  line-height: 1.9; font-size: 15px; min-height: 200px;
}
.sc-narrator { color: var(--paper-300); }
.sc-dialogue { color: var(--brass-300); font-weight: 500; }
.sc-progress {
  background: var(--ink-800); border-radius: 12px; padding: 16px 20px; margin-bottom: 16px;
  font-size: 13px; color: var(--paper-400);
}
.sc-progress .bar { height: 6px; background: oklch(1 0 0 / 0.08); border-radius: 3px; margin-top: 8px; overflow: hidden; }
.sc-progress .bar div { height: 100%; background: linear-gradient(90deg, var(--brass-500), var(--brass-300)); border-radius: 3px; transition: width .5s; }
.sc-opts { display: flex; flex-direction: column; gap: 8px; margin-bottom: 12px; }
.sc-opt {
  text-align: left; padding: 12px 16px; border-radius: 10px; cursor: pointer;
  background: var(--ink-800); color: var(--paper-50); font-size: 14px;
  border: 1px solid oklch(1 0 0 / 0.1); font-family: var(--font-body);
  transition: border-color 120ms;
}
.sc-opt:hover:not(:disabled) { border-color: var(--brass-400); }
.sc-opt:disabled { cursor: default; opacity: .6; }
.sc-input-row { display: flex; gap: 8px; }
.sc-input-row input {
  flex: 1; padding: 12px 14px; border-radius: 10px; font-size: 14px;
  background: var(--ink-800); color: var(--paper-50);
  border: 1px solid oklch(1 0 0 / 0.1); font-family: var(--font-body);
}
.sc-btn {
  padding: 12px 24px; border-radius: 24px; font-weight: 700; cursor: pointer;
  background: var(--brass-400); color: #1a1a1a; border: none; font-size: 14px; font-family: var(--font-body);
}
.sc-btn:disabled { opacity: .5; }
.sc-btn.ghost { background: transparent; color: var(--brass-300); border: 1px solid var(--brass-400); }
.sc-mastered { font-size: 12px; color: var(--signal-green); margin-top: 8px; }
</style>
</head>
<body>
<main class="main">
  <div class="page-head">
    <div class="en">Scenario</div>
    <h1>情境式學習</h1>
    <p style="color:var(--paper-400);font-size:14px;">變成概念本身，用經歷去理解</p>
  </div>
  <div id="sc-view"></div>
</main>
<script src="../js/vendor/supabase.min.js"></script>
<script type="module" src="../js/pages/scenario.js"></script>
</body>
</html>
