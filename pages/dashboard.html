<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<link rel="icon" type="image/svg+xml" href="../favicon.svg">
<link rel="apple-touch-icon" href="../favicon.svg">
<meta property="og:site_name" content="曙光學習">
<meta property="og:type" content="website">
<meta name="theme-color" content="#0a0e1f">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>主控台 — 曙光學習</title>
<link rel="manifest" href="../manifest.json">
<link rel="stylesheet" href="../css/tokens.css?v=theme002">
<link rel="stylesheet" href="../css/motion.css?v=theme002">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@700;900&family=Noto+Sans+TC:wght@400;500;700&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
/* 對話優先主控台 */
.cp-hero { display:flex; gap:16px; align-items:flex-start; margin-bottom:20px; }
.cp-avatar { width:56px; height:56px; border-radius:50%; overflow:hidden; flex-shrink:0; }
.cp-chat-card { flex:1; background:var(--wash-03); border:1px solid var(--wash-08); border-radius:16px; padding:16px; min-width:0; }
.cp-greeting { font-size:14px; line-height:1.8; margin-bottom:12px; }
.cp-msgs { display:flex; flex-direction:column; gap:10px; max-height:300px; overflow-y:auto; margin-bottom:12px; }
.cp-msg { padding:10px 14px; border-radius:12px; font-size:13.5px; line-height:1.75; max-width:92%; }
.cp-msg.ai { background:oklch(0.74 0.14 80 / 0.08); border:1px solid oklch(0.74 0.14 80 / 0.2); align-self:flex-start; border-bottom-left-radius:4px; }
.cp-msg.user { background:oklch(0.6 0.2 250 / 0.12); border:1px solid oklch(0.6 0.2 250 / 0.25); align-self:flex-end; border-bottom-right-radius:4px; }
.cp-input-row { display:flex; gap:8px; }
.cp-input-row .input { flex:1; border-radius:20px; padding:10px 16px; font-size:14px; }
.cp-suggest { display:flex; gap:8px; flex-wrap:wrap; margin-top:10px; }
.cp-suggest .chip { font-size:12px; padding:6px 12px; border-radius:99px; border:1px solid var(--wash-12); background:transparent; color:var(--paper-300); cursor:pointer; }
.cp-suggest .chip:hover { border-color:var(--brass-400); color:var(--brass-300); }
.typing span { animation:blink 1s infinite; } .typing span:nth-child(2){animation-delay:.2s} .typing span:nth-child(3){animation-delay:.4s}
@keyframes blink { 0%,100%{opacity:.2} 50%{opacity:1} }
/* 下方功能區 */
.stat-row { display:flex; gap:10px; flex-wrap:wrap; }
.stat { flex:1; min-width:90px; text-align:center; padding:10px 6px; background:var(--wash-03); border-radius:10px; }
.stat .num { font-family:var(--font-mono); font-size:20px; font-weight:700; color:var(--brass-300); }
.stat .lbl { font-size:11px; color:var(--paper-400); margin-top:2px; }
.quick-links { display:grid; grid-template-columns:repeat(4, 1fr); gap:8px; }
.sec-title { font-size:14px; font-weight:700; margin:20px 0 10px; display:flex; align-items:center; gap:8px; }
.sec-title .en { font-family:var(--font-mono); font-size:10px; letter-spacing:.15em; color:var(--brass-400); }
@media (max-width:600px){
  .quick-links{grid-template-columns:repeat(2,1fr);}
  .cp-hero{flex-direction:column;align-items:stretch;}
  .cp-avatar{width:44px;height:44px;}
  .cp-msgs{max-height:240px;}
}
</style>
</head>
<body>
<div id="topbar"></div>
<main class="main" style="max-width:900px;">
  <!-- 小曙對話區 -->
  <div class="cp-hero">
    <div class="cp-avatar"><img src="../assets/icons/xiaoshu-avatar.webp" alt="小曙" style="width:100%;height:100%;border-radius:50%;object-fit:cover;"></div>
    <div class="cp-chat-card">
      <div style="font-size:12px;color:var(--brass-400);font-family:var(--font-mono);letter-spacing:.15em;margin-bottom:8px;">XIAO SHU · 學習陪伴者</div>
      <div class="cp-greeting" id="cp-greeting"><span style="color:var(--paper-400);">小曙正在了解你的學習狀況…</span></div>
      <div class="cp-msgs" id="cp-msgs" style="display:none;"></div>
      <div class="cp-input-row">
        <input class="input" id="cp-input" placeholder="跟小曙聊聊：想學什麼？需要安排複習？">
        <button class="btn btn-primary btn-sm" id="cp-send" style="border-radius:20px;">送出</button>
      </div>
      <div class="cp-suggest" id="cp-suggest"></div>
    </div>
  </div>

  <!-- 學習數據 -->
  <div class="sec-title"><span class="en">OVERVIEW</span> 學習一覽</div>
  <div class="stat-row" id="cp-stats">
    <div class="stat"><div class="num">–</div><div class="lbl">到期複習</div></div>
    <div class="stat"><div class="num">–</div><div class="lbl">知識節點</div></div>
    <div class="stat"><div class="num">–</div><div class="lbl">連續天數</div></div>
  </div>

  <!-- 學習循環 -->
  <div class="sec-title"><span class="en">CYCLE</span> 學習循環</div>
  <div style="display:flex;gap:8px;margin-bottom:24px;flex-wrap:wrap;">
    <a href="knowledge.html" class="card" style="flex:1;min-width:100px;padding:16px;text-align:center;text-decoration:none;">
      <img src="../assets/icons/nav-knowledge.webp" style="width:40px;height:40px;margin-bottom:8px;object-fit:contain;">
      <div style="font-size:13px;font-weight:700;">曙光寶庫</div>
      <div style="font-size:11px;color:var(--paper-400);">累積</div>
    </a>
    <a href="scenario.html" class="card" style="flex:1;min-width:100px;padding:16px;text-align:center;text-decoration:none;">
      <img src="../assets/icons/nav-island.webp" style="width:40px;height:40px;margin-bottom:8px;object-fit:contain;">
      <div style="font-size:13px;font-weight:700;">情境學習</div>
      <div style="font-size:11px;color:var(--paper-400);">體驗</div>
    </a>
    <a href="quiz.html" class="card" style="flex:1;min-width:100px;padding:16px;text-align:center;text-decoration:none;">
      <img src="../assets/icons/nav-quiz.webp" style="width:40px;height:40px;margin-bottom:8px;object-fit:contain;">
      <div style="font-size:13px;font-weight:700;">知識對戰</div>
      <div style="font-size:11px;color:var(--paper-400);">檢驗</div>
    </a>
    <a href="review.html" class="card" style="flex:1;min-width:100px;padding:16px;text-align:center;text-decoration:none;">
      <img src="../assets/icons/nav-review.webp" style="width:40px;height:40px;margin-bottom:8px;object-fit:contain;">
      <div style="font-size:13px;font-weight:700;">複習</div>
      <div style="font-size:11px;color:var(--paper-400);">鞏固</div>
    </a>
  </div>

  <!-- 今日學習目標 -->
  <div class="sec-title"><span class="en">GOALS</span> 今日學習目標</div>
  <div id="cp-goals" style="margin-bottom:24px;">
    <div class="card" style="padding:20px;">
      <div id="cp-goals-list" style="font-size:14px;color:var(--paper-400);">載入中…</div>
    </div>
  </div>

  <!-- AI 學習建議 -->
  <div class="sec-title"><span class="en">SUGGESTIONS</span> 小曙的建議</div>
  <div id="cp-suggestions" style="margin-bottom:24px;">
    <div class="card" style="padding:20px;">
      <div id="cp-suggestions-list" style="font-size:14px;color:var(--paper-400);">小曙正在為你分析…</div>
    </div>
  </div>

  <!-- Google Classroom 待交作業（選用功能） -->
  <div id="cr-section" style="display:none;">
    <div class="sec-title"><span class="en">CLASSROOM</span> 待交作業</div>
    <div id="cp-classroom" style="margin-bottom:24px;"></div>
  </div>

  <!-- 複習建議 -->
  <div class="sec-title"><span class="en">REVIEW</span> 複習建議</div>
  <div id="cp-review-suggest" style="margin-bottom:24px;">
    <div class="card" style="padding:20px;cursor:pointer;" onclick="location.href='review.html'">
      <div style="display:flex;align-items:center;gap:12px;">
        <img src="../assets/icons/nav-review.webp" alt="" style="width:36px;height:36px;object-fit:contain;">
        <div style="flex:1;">
          <div style="font-weight:700;margin-bottom:4px;">FSRS 智能複習</div>
          <div style="font-size:13px;color:var(--paper-400);" id="cp-review-desc">查看到期卡片</div>
        </div>
        <div style="color:var(--brass-300);">→</div>
      </div>
    </div>
  </div>

  <!-- 快捷入口 -->
  <div class="sec-title"><span class="en">READING</span> 今日閱讀</div>
  <div id="cp-reading" style="margin-bottom:24px;">
    <div class="card" style="padding:20px;cursor:pointer;" onclick="location.href='reading.html'">
      <div style="display:flex;align-items:center;gap:12px;">
        <img src="../assets/icons/nav-bookshelf.webp" style="width:44px;height:44px;object-fit:contain;">
        <div style="flex:1;">
          <div style="font-weight:700;margin-bottom:4px;">AI 跨語言閱讀</div>
          <div style="font-size:13px;color:var(--paper-400);" id="cp-reading-desc">用你學過的知識，練你想學的語言</div>
        </div>
        <div style="color:var(--brass-300);">→</div>
      </div>
    </div>
  </div>
  <div class="sec-title"><span class="en">HISTORY</span> 近 5 天學習紀錄</div>
  <div id="cp-history" style="margin-bottom:24px;"><p style="color:var(--paper-400);font-size:13px;">載入中…</p></div>
  <div class="sec-title"><span class="en">QUICK ACCESS</span> 功能</div>
  <div class="quick-links" id="cp-links"></div>
</main>
<script src="../js/vendor/supabase.min.js"></script>
<script type="module" src="../js/pages/dashboard.js?v=cr001"></script>
</body>
</html>
