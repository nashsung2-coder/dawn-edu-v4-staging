<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>費曼說服 — 曙光教育</title>
<link rel="manifest" href="../manifest.json">
<link rel="stylesheet" href="../css/tokens.css">
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@700;900&family=Noto+Sans+TC:wght@400;500;700&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
.fy-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
@media (max-width: 820px) { .fy-grid { grid-template-columns: 1fr; } }
.score-ring {
  width: 96px; height: 96px; border-radius: 50%;
  border: 3px solid var(--brass-400);
  display: flex; align-items: center; justify-content: center;
  flex-direction: column; margin-bottom: 12px;
}
.score-ring .v { font-family: var(--font-mono); font-size: 28px; font-weight: 700; color: var(--brass-300); }
.score-ring .l { font-size: 11px; color: var(--paper-400); }
.feedback { font-size: 14px; color: var(--paper-200); }
.feedback:empty { display: none; }
.feedback p { margin: 0 0 10px; line-height: 1.7; }
.feedback strong { color: var(--brass-300); }
.feedback ul, .feedback ol { margin: 8px 0 12px; padding-left: 20px; line-height: 1.7; }
.feedback li { margin-bottom: 6px; }
.feedback code { font-family: var(--font-mono); background: oklch(1 0 0 / 0.08); padding: 1px 6px; border-radius: 2px; font-size: 13px; }
.feedback pre { background: var(--ink-950); border: 1px solid oklch(1 0 0 / 0.1); border-radius: 3px; padding: 12px; overflow-x: auto; margin: 8px 0 12px; }
.feedback pre code { background: none; padding: 0; }
.feedback h2, .feedback h3, .feedback h4 { font-family: var(--font-display); margin: 14px 0 8px; color: var(--paper-50); }
.step-dots { display: flex; gap: 8px; margin-bottom: 16px; }
.step-dots span {
  font-family: var(--font-mono); font-size: 11px; letter-spacing: .1em;
  padding: 4px 12px; border-radius: 2px; color: var(--paper-400);
  background: oklch(1 0 0 / 0.04);
}
.step-dots span.on { color: var(--ink-950); background: var(--brass-400); font-weight: 700; }
</style>
</head>
<body>
<main class="main">
  <div class="page-head">
    <div class="en">Feynman</div>
    <h1>費曼說服</h1>
  </div>

  <div class="step-dots" id="fy-steps">
    <span class="on" data-s="1">主題</span>
    <span data-s="2">解釋</span>
    <span data-s="3">評估</span>
  </div>

  <div class="fy-grid">
    <div class="card">
      <h2>你的解釋</h2>
      <input class="input" id="fy-topic" placeholder="主題（例：牛頓第二運動定律）" style="margin-bottom:8px;">
      <div style="margin-bottom:12px;">
        <span style="font-size:12px;color:var(--paper-400);">不知道寫什麼？試試：</span>
        <div style="display:flex;gap:6px;flex-wrap:wrap;margin-top:6px;" id="fy-suggest">
          <button class="btn btn-ghost" style="font-size:12px;padding:4px 10px;" data-t="光合作用">光合作用</button>
          <button class="btn btn-ghost" style="font-size:12px;padding:4px 10px;" data-t="牛頓第二運動定律">牛頓第二定律</button>
          <button class="btn btn-ghost" style="font-size:12px;padding:4px 10px;" data-t="為什麼天空是藍色的">天空為什麼是藍的</button>
          <button class="btn btn-ghost" style="font-size:12px;padding:4px 10px;" data-t="勾股定理">勾股定理</button>
        </div>
      </div>
      <textarea class="textarea" id="fy-text" placeholder="用自己的話解釋這個概念…" style="min-height:200px;"></textarea>
      <div style="margin-top:12px;display:flex;gap:8px;">
        <button class="btn btn-primary" id="fy-judge">說服 AI</button>
        <button class="btn btn-ghost" id="fy-reset">重來</button>
      </div>
    </div>
    <div class="card">
      <h2>AI 評估</h2>
      <div id="fy-result">
        <p style="color:var(--paper-400);font-size:14px;">在左邊寫下你的解釋，按「說服 AI」。</p>
      </div>
    </div>
  </div>
  <div class="card" style="margin-top:20px;">
    <h2 style="margin-bottom:12px;">歷史說服</h2>
    <div id="fy-history"><p style="color:var(--paper-400);font-size:13px;">載入中…</p></div>
  </div>
</main>
<script type="module" src="../js/pages/feynman.js"></script>
</body>
</html>
