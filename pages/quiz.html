<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<link rel="icon" type="image/svg+xml" href="../favicon.svg">
<link rel="apple-touch-icon" href="../favicon.svg">
<meta property="og:site_name" content="曙光教育">
<meta property="og:type" content="website">
<meta name="theme-color" content="#0a0e1f">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>知識對戰 — 曙光教育</title>
<link rel="manifest" href="../manifest.json">
<link rel="stylesheet" href="../css/tokens.css">
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@700;900&family=Noto+Sans+TC:wght@400;500;700&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
.qz-setup { max-width: 560px; }
.opt-btn {
  display: block; width: 100%; text-align: left;
  background: var(--ink-800); color: var(--paper-50);
  border: 1px solid oklch(1 0 0 / 0.08); border-radius: 3px;
  padding: 14px 16px; margin-bottom: 8px; font-size: 14px;
  cursor: pointer; font-family: var(--font-body);
  transition: border-color 120ms var(--ease-out), background 120ms var(--ease-out);
}
.opt-btn:hover:not(:disabled) { border-color: var(--brass-400); }
.opt-btn:disabled { cursor: default; opacity: .85; }
.opt-btn.correct { border-color: var(--signal-green); background: oklch(0.72 0.14 150 / 0.12); }
.opt-btn.wrong { border-color: var(--signal-red); background: oklch(0.62 0.18 25 / 0.12); }
.opt-key {
  display: inline-block; width: 28px; height: 28px; line-height: 28px; text-align: center;
  border-radius: 2px; background: oklch(1 0 0 / 0.08);
  font-family: var(--font-mono); font-size: 13px; font-weight: 700;
  margin-right: 10px; color: var(--brass-300);
}
.q-progress { display: flex; gap: 6px; margin-bottom: 16px; }
.q-progress i {
  flex: 1; height: 4px; border-radius: 2px; background: oklch(1 0 0 / 0.1);
}
.q-progress i.done { background: var(--brass-400); }
.q-progress i.cur { background: var(--brass-300); }
.q-score { font-family: var(--font-mono); font-size: 40px; font-weight: 700; color: var(--brass-300); }
</style>
</head>
<body>
<main class="main">
  <div class="page-head">
    <div class="en">Battle</div>
    <h1>知識對戰</h1>
  </div>
  <div id="qz-view"></div>
</main>
<script src="../js/vendor/supabase.min.js"></script>
<script type="module" src="../js/pages/quiz.js"></script>
</body>
</html>
