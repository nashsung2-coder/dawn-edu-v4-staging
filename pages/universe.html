<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>宇宙 — 曙光教育</title>
<link rel="manifest" href="../manifest.json">
<link rel="stylesheet" href="../css/tokens.css">
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@700;900&family=Noto+Sans+TC:wght@400;500;700&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
.uni-wrap { position:relative; min-height:calc(100vh - 120px); }
#star-map { width:100%; height:calc(100vh - 220px); min-height:420px; background:radial-gradient(ellipse at 50% 30%, oklch(0.18 0.04 260) 0%, oklch(0.10 0.03 260) 60%, oklch(0.07 0.02 260) 100%); border:1px solid oklch(0.60 0.12 80 / 0.15); border-radius:3px; cursor:crosshair; }
.planet { cursor:pointer; transition:filter .2s; }
.planet:hover { filter:brightness(1.3); }
.planet.owned { filter:drop-shadow(0 0 8px oklch(0.60 0.12 80 / 0.6)); }
.planet-label { font-size:11px; fill:var(--paper-300); text-anchor:middle; pointer-events:none; font-family:var(--font-sans); }
.uni-panel { position:absolute; top:16px; right:16px; width:300px; max-width:calc(100% - 32px); background:var(--ink-900); border:1px solid oklch(0.60 0.12 80 / 0.25); border-top:2px solid var(--brass-400); border-radius:3px; padding:20px; display:none; z-index:5; }
.uni-panel.show { display:block; }
.hp-bar { height:8px; background:oklch(1 0 0 / 0.1); border-radius:4px; overflow:hidden; margin:8px 0; }
.hp-bar i { display:block; height:100%; background:linear-gradient(90deg, var(--signal-red), oklch(0.65 0.15 40)); transition:width .5s; }
.battle-log { max-height:200px; overflow-y:auto; font-size:13px; margin:12px 0; }
.battle-log p { margin:4px 0; }
.battle-log .hit { color:var(--brass-300); }
.battle-log .miss { color:var(--signal-red); }
.diff-stars { color:var(--brass-400); letter-spacing:2px; }
</style>
</head>
<body>
<div class="main">
  <div class="page-head">
    <div class="en">UNIVERSE</div>
    <h1>宇宙</h1>
    <p>用知識征服星球。答對題目造成傷害，血量歸零即佔領。</p>
    <p style="font-size:13px;color:var(--brass-300);margin-top:8px;"><img class="inline-ico" src="../assets/icons/icon-bulb.webp" alt="" loading="lazy"> 點擊任意星球查看詳情，發起征服戰</p>
  </div>
  <div class="uni-wrap">
    <svg id="star-map" viewBox="0 0 100 100" preserveAspectRatio="xMidYMid meet"></svg>
    <div class="uni-panel" id="uni-panel"></div>
  </div>
</div>
<script type="module" src="../js/pages/universe.js"></script>
</body>
</html>
